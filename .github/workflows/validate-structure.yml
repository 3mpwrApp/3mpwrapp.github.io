name: Structure Validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate-structure:
    name: Validate Folder Structure
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        
      - name: Setup Node.js
        uses: actions/setup-node@v6 # v6.1.0
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Cache node_modules
        uses: actions/cache@v5 # v5.0.1
        with:
          path: node_modules
          key: ${{ runner.os }}-node20v2-${{ hashFiles('**/package-lock.json') }}
          
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
        
      - name: Run structure validation
        run: node scripts/validate-structure.mjs --report
        continue-on-error: true # Advisory - structure warnings don't block CI
        
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: structure-report
          path: structure-report.json
          retention-days: 30
          
      - name: Comment PR with results
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('structure-report.json', 'utf8'));
            
            const totalIssues = report.totalIssues || 0;
            const namingIssues = report.issues.namingViolations?.length || 0;
            const misplacedFiles = report.issues.misplacedFiles?.length || 0;
            const deprecatedFolders = report.issues.deprecatedFolders?.length || 0;
            
            const body = `## ❌ Structure Validation Failed
            
            **Total Issues:** ${totalIssues}
            
            ### Issues Breakdown:
            - 🔤 Naming Violations: ${namingIssues}
            - 📁 Misplaced Files: ${misplacedFiles}
            - ⚠️ Deprecated Folders: ${deprecatedFolders}
            
            ### Action Required:
            1. Review the validation errors in the logs
            2. Fix naming conventions (see \`docs/RECOMMENDED_STRUCTURE.md\`)
            3. Move files to correct folders
            4. Run \`node scripts/validate-structure.mjs\` locally to verify
            
            📚 See [Structure Documentation](../blob/main/docs/RECOMMENDED_STRUCTURE.md) for guidelines.
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
