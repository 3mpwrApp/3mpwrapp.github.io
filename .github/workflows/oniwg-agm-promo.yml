name: ONIWG AGM Promotion

# Event: May 7-8, 2026 in Toronto
# Manual trigger available

on:
  workflow_dispatch:
  schedule:
    # Run 3x per week: Monday, Wednesday, Friday at 10AM EST (3PM UTC)
    - cron: '0 15 * * 1,3,5'

concurrency:
  group: oniwg-agm-promo
  cancel-in-progress: false

jobs:
  post-oniwg-agm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      
      - name: Check if event has passed
        id: check_date
        run: |
          if [ $(date +%s) -gt $(date -d '2026-05-08 23:59:59' +%s) ]; then
            echo "event_passed=true" >> $GITHUB_OUTPUT
            echo "✅ Event has passed, workflow will stop"
          else
            echo "event_passed=false" >> $GITHUB_OUTPUT
            echo "📅 Event upcoming, proceeding with post"
          fi
      
      - name: Post to social media
        if: steps.check_date.outputs.event_passed == 'false'
        env:
          MASTO_TOKEN: ${{ secrets.MASTO_TOKEN }}
          MASTO_INSTANCE: ${{ secrets.MASTO_INSTANCE }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_MODE: false
        run: |
          echo "📅 Posting ONIWG AGM promotion..."
          node scripts/post-oniwg-agm-promo.js
          
          if [ $? -eq 0 ]; then
            echo "✅ Successfully posted to social media"
          else
            echo "⚠️ Posting completed with warnings"
          fi
      
      - name: Commit state file
        if: steps.check_date.outputs.event_passed == 'false'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add .github/state/oniwg-agm-state.json || true
          
          if git diff --staged --quiet; then
            echo "📊 No state changes to commit"
          else
            git commit -m "chore: update ONIWG AGM state

- Post rotated to next variant
- Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
            echo "✅ State file committed"
          fi
      
      - name: Summary
        run: |
          echo "## 📅 ONIWG AGM Promotion" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_date.outputs.event_passed }}" = "true" ]; then
            echo "✅ Event has passed - promotion complete" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Promotion posted successfully" >> $GITHUB_STEP_SUMMARY
            echo "Posted to: Mastodon, Bluesky, Discord" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Event:** ONIWG Annual General Meeting" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** May 7-8, 2026" >> $GITHUB_STEP_SUMMARY
          echo "**Location:** Toronto" >> $GITHUB_STEP_SUMMARY
          echo "**Frequency:** 3x per week (until May 8)" >> $GITHUB_STEP_SUMMARY
