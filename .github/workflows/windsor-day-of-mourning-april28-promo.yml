name: Windsor Day of Mourning Promotion

# Windsor National Day of Mourning - April 28, 2026, 5 PM EST
# Posts 2x daily until event
# Manual trigger available

on:
  workflow_dispatch:
  schedule:
    # Run 2x daily: 10 AM EST and 4 PM EST
    - cron: '0 15 * * *'  # 10 AM EST (3 PM UTC)
    - cron: '0 21 * * *'  # 4 PM EST (9 PM UTC)

concurrency:
  group: windsor-day-of-mourning-promo
  cancel-in-progress: false

jobs:
  post-windsor-event:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      
      - name: Install dependencies
        run: npm install
      
      - name: Check if event has passed
        id: check_date
        run: |
          if [ $(date +%s) -gt $(date -d '2026-04-28 17:00:00' +%s) ]; then
            echo "event_passed=true" >> $GITHUB_OUTPUT
            echo "✅ Event has passed, workflow will stop"
          else
            echo "event_passed=false" >> $GITHUB_OUTPUT
            echo "⏰ Event upcoming, proceeding with post"
          fi
      
      - name: Post to social media
        if: steps.check_date.outputs.event_passed == 'false'
        env:
          MASTO_TOKEN: ${{ secrets.MASTO_TOKEN }}
          MASTO_INSTANCE: ${{ secrets.MASTO_INSTANCE }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          node scripts/post-windsor-day-of-mourning-april28.js
      
      - name: Commit state file
        if: steps.check_date.outputs.event_passed == 'false'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/state/windsor-day-of-mourning-state.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update Windsor Day of Mourning state [skip ci]"
            git push
          fi
