name: Weekly Update Post

# Generate one weekly recap summary
# Runs every Monday at 9 AM UTC

on:
  schedule:
    - cron: '0 9 * * 1'  # 9:00 AM UTC every Monday
    
  workflow_dispatch:
    inputs:
      force_generate:
        description: 'Force generate even if already done this week'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '20'

# Prevent overlapping weekly updates
concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  weekly_update:
    name: Generate Weekly Recap
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    
    steps:
      - name: Checkout site repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Validate content policy
        run: node scripts/validate-content.js

      - name: Generate weekly recap from queue
        run: |
          echo "Generating weekly recap post..."
          node scripts/weekly-update-generator-v2.js

      - name: Commit update
        run: |
          git config --local user.email "empowrapp08162025@gmail.com"
          git config --local user.name "3mpwrApp Content Bot"
          
          git add _posts/ data/weekly-queue.json data/weekly-queue-archive/ || true
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          WEEK=$(date -u +%V)
          YEAR=$(date -u +%Y)
          git commit -m "feat(blog): weekly recap - week $WEEK ($YEAR)"
          git push origin main

      - name: Create summary
        if: always()
        run: |
          WEEK=$(date -u +%V)
          YEAR=$(date -u +%Y)
          
          echo "# Weekly Update - Week $WEEK ($YEAR)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Generated:** $(date -u +"%Y-%m-%d %H:%M UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "**Recent commits in queue were processed into a single weekly recap.**" >> $GITHUB_STEP_SUMMARY

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-update-${{ github.run_id }}
          path: |
            _posts/*weekly-recap*.md
            data/weekly-queue-archive/*.json
          retention-days: 30
