name: i18n Quality Checks

on:
  pull_request:
    paths:
      - 'locales/**'
      - 'scripts/i18n-*'
      - 'i18n/**'
  push:
    branches: [main]
    paths:
      - 'locales/**'
      - 'scripts/i18n-*'
      - 'i18n/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  i18n-validation:
    name: i18n Validation Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v6 # v6.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v5 # v5.0.1
        with:
          path: node_modules
          key: ${{ runner.os }}-node20v2-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Validate JSON syntax
        run: npm run i18n:validate

      - name: Check key differences
        run: npm run i18n:diff

      - name: Validate plural keys
        run: npm run i18n:plural

      - name: Check untranslated threshold
        run: npm run i18n:threshold
        env:
          I18N_MAX_UNTRANSLATED: 400

      - name: Detect orphan/missing keys
        run: npm run i18n:orphans

      - name: Assert no [T] tags (release gate)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run i18n:assert

      - name: Show untranslated progress delta
        run: npm run i18n:progress

      - name: Lint i18n keys
        run: npm run i18n:lint
        continue-on-error: true # Advisory

      - name: Generate coverage report
        run: npm run i18n:coverage
        continue-on-error: true # Advisory
