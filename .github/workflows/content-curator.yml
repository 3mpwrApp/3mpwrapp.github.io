name: Content Curator (Unified)

# Unified content curation and posting workflow
# Consolidates: curator.yml, weekly-curator.yml, weekly-blog.yml
# 
# Daily: Curates and posts content 1x/day (12 PM UTC - after daily-feature at 10 AM)
# Weekly: Generates summary post every Monday at 9 AM UTC

on:
  schedule:
    # Daily curation - 1x per day (reduced from 2x)
    - cron: '0 12 * * *'   # 12:00 PM UTC - After daily-feature (10 AM)
    # Weekly summary - Every Monday at 9 AM UTC
    - cron: '0 9 * * 1'    # Monday 9:00 AM UTC
    
  workflow_dispatch:
    inputs:
      mode:
        description: 'Workflow mode'
        required: false
        default: 'daily'
        type: choice
        options:
          - daily
          - weekly
      force_publish:
        description: 'Force publish low-score items'
        required: false
        default: false
        type: boolean
      min_score:
        description: 'Minimum score threshold'
        required: false
        default: '2.5'
        type: string
      debug_mode:
        description: 'Enable debug logging'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '20'
  DEBUG_CURATOR: ${{ github.event.inputs.debug_mode == 'true' && '1' || '0' }}

# Prevent multiple curator runs from overlapping
concurrency:
  group: content-curator
  cancel-in-progress: false  # Don't cancel - let scheduled runs complete

jobs:
  # Daily Content Curation
  daily_curation:
    name: Daily Content Curation
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Reduced from 25 (deployment wait now 1.5 min max)
    if: github.event.inputs.mode != 'weekly'
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          npm ci
          echo "✅ Dependencies installed"
          npm list date-fns || echo "⚠️ date-fns not found"

      - name: Validate configuration
        run: |
          echo "📋 Validating curator configuration..."
          node scripts/curator-config.js validate || echo "⚠️ Config validation optional"
          node scripts/curator-config.js summary || echo "⚠️ Config summary optional"

      - name: Run content curation
        env:
          MIN_SCORE: ${{ github.event.inputs.min_score || '2.5' }}
          FORCE_PUBLISH: ${{ github.event.inputs.force_publish == 'true' && '1' || '0' }}
          DEBUG_CURATOR: ${{ env.DEBUG_CURATOR }}
          WRITE_JSON: '1'
          FILTER_LANGS: 'en,fr'
        run: |
          echo "🚀 Starting content curation"
          echo "  Min Score: $MIN_SCORE"
          echo "  Force Publish: $FORCE_PUBLISH"
          echo ""
          
          node scripts/curator-core.js
          
          if [ ! -f "public/curation-latest.json" ]; then
            echo "⚠️ No curation output (may be normal if no quality content found)"
          fi

      - name: Build search index
        continue-on-error: true
        run: |
          echo "🔍 Building search index..."
          node scripts/build-search-index.js || echo "⚠️ Search index build optional"

      - name: Commit changes
        run: |
          git config --local user.email "empowrapp08162025@gmail.com"
          git config --local user.name "3mpwrApp Curator Bot"
          
          git add _curation/ _posts/ public/ _data/curator.json || true
          
          if git diff --staged --quiet; then
            echo "✅ No changes to commit"
            exit 0
          fi
          
          TODAY=$(date -u +%Y-%m-%d)
          
          # Check if curator.json changed (auto-learning)
          if git diff --staged --name-only | grep -q "curator.json"; then
            git commit -m "feat(curator): Daily curation $TODAY + auto-learned keywords"
          else
            git commit -m "feat(curator): Daily curation $TODAY - automated content aggregation"
          fi
          
          git push origin main || echo "⚠️ No changes to push"

      - name: Quick deployment verification (non-blocking)
        continue-on-error: true
        run: |
          echo "⏳ Quick check if Cloudflare Pages deployed..."
          echo "Note: Cloudflare auto-builds from git push - no manual deploy needed"
          echo "Starting check at $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          
          BLOG_URL="https://3mpwrapp.pages.dev/blog/"
          
          # Quick check: 3 attempts with 30-second intervals (max 1.5 min)
          for ATTEMPT in 1 2 3; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$BLOG_URL")
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Blog is live! (HTTP $HTTP_CODE after ${ATTEMPT} attempt(s))"
              echo "Verified at $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
              exit 0
            fi
            
            if [ $ATTEMPT -lt 3 ]; then
              echo "⏳ Attempt $ATTEMPT: HTTP $HTTP_CODE - waiting 30s..."
              sleep 30
            fi
          done
          
          echo "ℹ️ Blog not immediately accessible (HTTP $HTTP_CODE)"
          echo "This is normal - Cloudflare Pages may still be building."
          echo "Site will be live shortly. Not blocking workflow."
            echo "Aborting social media posting to prevent 404 links."
            exit 1
          fi

      - name: Post to social media
        if: success() || failure()
        continue-on-error: true
        env:
          MASTO_INSTANCE: ${{ secrets.MASTO_INSTANCE }}
          MASTO_TOKEN: ${{ secrets.MASTO_TOKEN }}
          MASTO_VISIBILITY: 'public'
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          BLUESKY_PDS: 'https://bsky.social'
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          SUBSTACK_PUBLICATION_ID: ${{ secrets.SUBSTACK_PUBLICATION_ID }}
          SUBSTACK_API_KEY: ${{ secrets.SUBSTACK_API_KEY }}
        run: |
          echo "📤 Posting to social media..."
          node scripts/social-post.js || echo "⚠️ Social posting failed"

      - name: Create summary
        if: always()
        run: |
          echo "# 📰 Daily Curator - $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "public/curation-latest.json" ]; then
            ITEMS=$(jq '.count' public/curation-latest.json 2>/dev/null || echo "0")
            echo "✅ **Curated:** $ITEMS items" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Top Stories:**" >> $GITHUB_STEP_SUMMARY
            jq -r '.items[0:3][] | "• \(.title)"' public/curation-latest.json 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-curation-${{ github.run_id }}
          path: |
            public/curation-latest.json
            public/posting-results.json
          retention-days: 7

  # Weekly Summary Post
  weekly_summary:
    name: Weekly Summary Post
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    
    steps:
      - name: Check if Monday 9 AM UTC (weekly time)
        id: check_time
        run: |
          hour=$(date -u +%H)
          day=$(date -u +%u)
          if [ "$day" -eq 1 ] && [ "$hour" -ge 9 ] && [ "$hour" -lt 10 ]; then
            echo "is_weekly_time=true" >> $GITHUB_OUTPUT
            echo "✅ It's Monday 9 AM UTC - running weekly summary"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.mode }}" == "weekly" ]; then
            echo "is_weekly_time=true" >> $GITHUB_OUTPUT
            echo "✅ Manual weekly mode triggered"
          else
            echo "is_weekly_time=false" >> $GITHUB_OUTPUT
            echo "⏭️ Not weekly time - skipping"
            exit 0
          fi
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate weekly post
        run: |
          echo "📝 Generating weekly summary post..."
          node scripts/generate-weekly-post.js

      - name: Commit weekly post
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'actions@users.noreply.github.com'
          
          git add _posts/*weekly*.md || true
          
          if git diff --cached --quiet; then
            echo '✅ No weekly post changes to commit'
            exit 0
          fi
          
          git commit -m 'feat(blog): Weekly summary post - automated update'
          git push origin main || echo '⚠️ No changes to push'

      - name: Create summary
        if: always()
        run: |
          echo "# 📝 Weekly Summary - $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Weekly summary post generated and committed" >> $GITHUB_STEP_SUMMARY

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-post-${{ github.run_id }}
          path: _posts/*weekly*.md
          retention-days: 7
