name: Performance Monitoring

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  bundle-analysis:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node20v2-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Check bundle budget
        id: budget
        run: |
          npm run perf:budget && echo "budget_passed=0" >> $GITHUB_OUTPUT || echo "budget_passed=1" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Generate bundle breakdown
        run: npm run perf:breakdown > bundle-breakdown.txt

      - name: Check max file size
        env:
          PERF_MAX_ALLOW: >-
            components.*Content\.tsx,
            LegalWorkflowEngine\.tsx,
            campaign-coordinator\.tsx,
            advanced-security\.tsx,
            campaign-coordinator\.impl\.tsx,
            advanced-security\.impl\.tsx,
            onboarding\.tsx,
            settings.*index\.tsx,
            events.*index\.impl\.tsx,
            self-care-library.*\.tsx,
            daily-planner.*\.tsx,
            master-tracker-hub\.tsx,
            energy-hub\.tsx,
            circadianRhythmDJ\.ts,
            denial-decoder\.tsx,
            research-library\.ts,
            wellnessFeatureUpgrades.*\.ts,
            rights-checker\.tsx,
            cognitiveDistortionScanner\.ts,
            wellnessAIOrchestrator\.ts,
            allyship-playbook\.tsx,
            solidarity-toolkit\.tsx,
            functionalCapacityEvaluator\.ts,
            policy-simulator\.tsx,
            claims-navigator\.tsx,
            profile-editor\.tsx,
            profile.*editor\.tsx,
            case-timeline\.tsx,
            rtw-planner\.tsx,
            emotionalWeatherStation\.ts,
            campaigns.*index\.tsx,
            spoonEconomist\.ts,
            energy-mood-dashboard\.tsx,
            circadian-dj\.tsx,
            aiGroundingCompanion\.ts,
            TermsGate\.tsx
        run: node ./scripts/perf-max-file-size.mjs

      - name: Upload bundle breakdown
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: bundle-analysis
          path: bundle-breakdown.txt
          retention-days: 30

      - name: Comment on PR with bundle size
        if: github.event_name == 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const breakdown = fs.readFileSync('bundle-breakdown.txt', 'utf8');
            
            const comment = `## 📦 Bundle Size Analysis
            
            \`\`\`
            ${breakdown}
            \`\`\`
            
            **Status:** ${context.payload.pull_request.head.sha}
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Fail if budget exceeded
        if: steps.budget.outputs.budget_passed == '1'
        run: |
          echo "::error::Bundle size budget exceeded!"
          exit 1

  reading-level:
    name: Content Reading Level
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node20v2-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Check reading level
        run: npm run read:level
        continue-on-error: true # Advisory check
