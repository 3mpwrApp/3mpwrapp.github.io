name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (CI)
        run: |
          if npm run | grep -q "lint:ci"; then npm run lint:ci; else npm run lint || true; fi

      - name: Typecheck (strict)
        run: |
          if npm run | grep -q "typecheck:strict"; then npm run typecheck:strict; else echo "No typecheck:strict script"; fi

      - name: Expo Doctor (optional)
        run: npx expo-doctor || true

