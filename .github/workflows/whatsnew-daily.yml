name: What's New Daily Generator

on:
  schedule:
    # Daily at 06:10 UTC
    - cron: '10 6 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'docs/CHANGELOG.md'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-whatsnew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies (no audit/fund)
        run: npm ci --no-audit --fund=false
      - name: Generate What's New module
        run: npm run whatsnew:gen
      - name: Create Pull Request if changes detected
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(whatsnew): auto-generate from docs/CHANGELOG.md'
          title: 'chore(whatsnew): daily auto-generation'
          body: |
            This PR is auto-generated by a daily workflow. It updates `data/whatsnew.auto.ts` from `docs/CHANGELOG.md`.

            - Runs entirely on GitHub Actions (free tier)
            - No paid services required
            - Local override: `npm run whatsnew:gen`
          branch: chore/whatsnew-auto
          add-paths: |
            data/whatsnew.auto.ts
          labels: automation, whatsnew
