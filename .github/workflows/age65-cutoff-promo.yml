name: Age 65 Cut-Off Campaign

# Ongoing campaign: 2x weekly posts

on:
  workflow_dispatch:
  schedule:
    # Run 2x per week: Tuesday at 9AM EST (2PM UTC), Friday at 9AM EST (2PM UTC)
    - cron: '0 14 * * 2,5'

concurrency:
  group: age65-cutoff-promo
  cancel-in-progress: false

jobs:
  post-age65-cutoff:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      
      - name: Post to social media
        env:
          MASTO_TOKEN: ${{ secrets.MASTO_TOKEN }}
          MASTO_INSTANCE: ${{ secrets.MASTO_INSTANCE }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_MODE: false
        run: |
          echo "🚨 Posting Age 65 Cut-Off campaign..."
          node scripts/post-age65-cutoff-promo.js
          
          if [ $? -eq 0 ]; then
            echo "✅ Successfully posted to social media"
          else
            echo "⚠️ Posting completed with warnings"
          fi
      
      - name: Commit state file
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add .github/state/age65-cutoff-state.json || true
          
          if git diff --staged --quiet; then
            echo "📊 No state changes to commit"
          else
            git commit -m "chore: update age65-cutoff campaign state

- Post rotated to next variant
- Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
            echo "✅ State file committed"
          fi
      
      - name: Summary
        run: |
          echo "## 🚨 Age 65 Cut-Off Campaign" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Promotion posted successfully" >> $GITHUB_STEP_SUMMARY
          echo "Posted to: Mastodon, Bluesky, Discord" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Campaign:** End the Age 65 Cut-Off for Injured Workers" >> $GITHUB_STEP_SUMMARY
          echo "**Action:** Email your MPP demanding fair compensation" >> $GITHUB_STEP_SUMMARY
          echo "**Frequency:** 2x per week (ongoing campaign)" >> $GITHUB_STEP_SUMMARY
