name: AI Code Review Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  ai-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get PR diff
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          echo "diff_size=$(wc -l < pr_diff.txt)" >> $GITHUB_OUTPUT
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Run AI Code Review
        env:
          KIMI_API_KEY: ${{ secrets.KIMIAPIKEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node << 'EOF'
          const fs = require('fs');
          const https = require('https');
          
          const KIMI_API_KEY = process.env.KIMI_API_KEY;
          const PR_NUMBER = process.env.PR_NUMBER;
          const PR_TITLE = process.env.PR_TITLE;
          const GITHUB_TOKEN = process.env.GITHUB_TOKEN;
          
          // Read the diff
          const diff = fs.readFileSync('pr_diff.txt', 'utf-8');
          
          if (!KIMI_API_KEY) {
            console.log('ℹ️ KIMI_API_KEY not set — skipping AI review');
            process.exit(0);
          }
          
          if (!diff || diff.length < 10) {
            console.log('No significant changes to review');
            process.exit(0);
          }
          
          // Prepare the review prompt
          const prompt = `You are an expert code reviewer for the 3mpwr App, a React Native/Expo application supporting domestic violence survivors.

Review this pull request and provide:
1. **Security**: Any security concerns (data privacy, encryption, auth)
2. **Accessibility**: WCAG compliance, screen reader support
3. **Performance**: Potential performance issues
4. **Code Quality**: Best practices, maintainability
5. **User Safety**: Features that could impact user safety/privacy
6. **Suggestions**: Specific improvements

Pull Request: "${PR_TITLE}"

Diff:
\`\`\`
${diff.substring(0, 15000)}
\`\`\`

Provide a concise, actionable review in markdown format.`;

          // Call Kimi API (OpenAI-compatible)
          async function getReview() {
            return new Promise((resolve, reject) => {
              const data = JSON.stringify({
                model: 'moonshot-v1-32k',
                max_tokens: 2000,
                messages: [
                  { role: 'user', content: prompt }
                ]
              });
              
              const options = {
                hostname: 'api.moonshot.cn',
                path: '/v1/chat/completions',
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${KIMI_API_KEY}`,
                  'Content-Length': Buffer.byteLength(data)
                }
              };
              
              const req = https.request(options, (res) => {
                let body = '';
                res.on('data', (chunk) => { body += chunk; });
                res.on('end', () => {
                  if (res.statusCode === 200) {
                    const response = JSON.parse(body);
                    resolve(response.choices[0].message.content);
                  } else {
                    reject(new Error(`API error: ${res.statusCode} - ${body}`));
                  }
                });
              });
              
              req.on('error', reject);
              req.write(data);
              req.end();
            });
          }
          
          // Post comment to PR
          async function postComment(review) {
            return new Promise((resolve, reject) => {
              const comment = `## 🤖 AI Code Review

${review}

---
*This review was generated by the AI Code Review Agent. Please verify all suggestions manually.*`;
              
              const data = JSON.stringify({ body: comment });
              
              const options = {
                hostname: 'api.github.com',
                path: `/repos/${{ github.repository }}/issues/${PR_NUMBER}/comments`,
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `token ${GITHUB_TOKEN}`,
                  'User-Agent': '3mpwr-ai-review',
                  'Content-Length': data.length
                }
              };
              
              const req = https.request(options, (res) => {
                let body = '';
                res.on('data', (chunk) => { body += chunk; });
                res.on('end', () => resolve(body));
              });
              
              req.on('error', reject);
              req.write(data);
              req.end();
            });
          }
          
          // Run review
          (async () => {
            try {
              console.log('Getting AI review...');
              const review = await getReview();
              console.log('Review generated, posting comment...');
              await postComment(review);
              console.log('Review posted successfully!');
            } catch (error) {
              console.error('Review failed:', error);
              process.exit(1);
            }
          })();
          EOF
