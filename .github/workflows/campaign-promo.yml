name: Campaign Promotion

# Post active campaign promotions twice a week
# Tuesday morning: "Rights Don't Retire" campaign promotion
# Friday morning: "Pass Bill 86" campaign promotion

on:
  schedule:
    - cron: '0 13 * * 2'  # Tuesday 1 PM UTC (8 AM EST)
    - cron: '0 13 * * 5'  # Friday 1 PM UTC (8 AM EST)
    
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode (skip posting, just show what would be posted)'
        required: false
        default: false
        type: boolean
      force_campaign:
        description: 'Force specific campaign (rights-dont-retire or pass-bill-86)'
        required: false
        type: choice
        options:
          - ''
          - rights-dont-retire
          - pass-bill-86

env:
  NODE_VERSION: '20'

# Prevent overlapping runs
concurrency:
  group: campaign-promo
  cancel-in-progress: false

jobs:
  post_promotion:
    name: Post Campaign Promotion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.CONTENT_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          npm ci --ignore-scripts --no-audit --fund=false
          echo "✅ Dependencies installed"

      - name: Post to social media
        env:
          MASTO_TOKEN: ${{ secrets.MASTO_TOKEN }}
          MASTO_INSTANCE: ${{ secrets.MASTO_INSTANCE }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_MODE: ${{ github.event.inputs.test_mode }}
          FORCE_CAMPAIGN: ${{ github.event.inputs.force_campaign }}
        run: |
          echo "📤 Posting campaign promotion..."
          node scripts/post-campaign-promo.js
          
          if [ $? -eq 0 ]; then
            echo "✅ Successfully posted to social media"
          else
            echo "⚠️ Posting completed with warnings"
          fi

      - name: Commit state file
        id: commit
        continue-on-error: true
        run: |
          git config --local user.email "empowrapp08162025@gmail.com"
          git config --local user.name "3mpwrApp Content Bot"

          git add public/campaign-promo-state.json || true

          if git diff --staged --quiet; then
            echo "✅ No state changes to commit"
            exit 0
          fi

          git commit -m "chore: Update campaign promo state - automated post"

          if git push origin main 2>&1; then
            echo "✅ State file committed and pushed"
          else
            echo "⚠️ Push failed (likely no changes or conflict)"
          fi

      - name: Summary
        run: |
          echo "### 📣 Campaign Promotion Posted" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Day**: $(date -u +%A)" >> $GITHUB_STEP_SUMMARY
          echo "**Time**: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Posted to Mastodon, Bluesky, Discord" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Active Campaigns**:" >> $GITHUB_STEP_SUMMARY
          echo "- Rights Don't Retire: https://win.newmode.net/rightsdontretire" >> $GITHUB_STEP_SUMMARY
          echo "- Pass Bill 86: https://passbill86.ca/" >> $GITHUB_STEP_SUMMARY
