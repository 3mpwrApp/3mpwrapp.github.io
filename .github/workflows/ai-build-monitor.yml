name: AI Build Monitor Agent

on:
  workflow_run:
    workflows: ["*"]
    types: [completed]
  workflow_dispatch:

jobs:
  analyze-builds:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Get workflow logs
        id: logs
        run: |
          echo "Analyzing failed build: ${{ github.event.workflow_run.name }}"
          echo "Run ID: ${{ github.event.workflow_run.id }}"
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: AI Build Analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node << 'EOF'
          const https = require('https');
          
          const ANTHROPIC_API_KEY = process.env.ANTHROPIC_API_KEY;
          const WORKFLOW_NAME = process.env.WORKFLOW_NAME;
          const RUN_URL = process.env.RUN_URL;
          
          // Analyze the build failure
          const prompt = `You are a DevOps expert analyzing a failed GitHub Actions workflow.

Workflow: ${WORKFLOW_NAME}
Status: Failed
URL: ${RUN_URL}

Based on common failure patterns in CI/CD for React Native/Expo apps, provide:

1. **Likely Causes**: Top 3 most probable reasons for failure
2. **Quick Fixes**: Immediate actions to try
3. **Prevention**: How to prevent this in future
4. **Monitoring**: What to monitor to catch this earlier

Focus on practical, actionable advice. Be concise.`;

          async function getAnalysis() {
            return new Promise((resolve, reject) => {
              const data = JSON.stringify({
                model: 'claude-3-5-sonnet-20241022',
                max_tokens: 1500,
                messages: [
                  { role: 'user', content: prompt }
                ]
              });
              
              const options = {
                hostname: 'api.anthropic.com',
                path: '/v1/messages',
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'x-api-key': ANTHROPIC_API_KEY,
                  'anthropic-version': '2023-06-01',
                  'Content-Length': data.length
                }
              };
              
              const req = https.request(options, (res) => {
                let body = '';
                res.on('data', (chunk) => { body += chunk; });
                res.on('end', () => {
                  if (res.statusCode === 200) {
                    const response = JSON.parse(body);
                    resolve(response.content[0].text);
                  } else {
                    reject(new Error(`API error: ${res.statusCode}`));
                  }
                });
              });
              
              req.on('error', reject);
              req.write(data);
              req.end();
            });
          }
          
          (async () => {
            try {
              console.log('Analyzing build failure with AI...');
              const analysis = await getAnalysis();
              console.log('\n=== AI BUILD ANALYSIS ===\n');
              console.log(analysis);
              console.log('\n======================\n');
            } catch (error) {
              console.error('Analysis failed:', error);
            }
          })();
          EOF
      
      - name: Create Issue for Failed Build
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🤖 Build Failed: ${process.env.WORKFLOW_NAME}`,
              body: `The workflow "${process.env.WORKFLOW_NAME}" has failed.

**Run URL**: ${process.env.RUN_URL}

The AI Build Monitor Agent has been triggered to analyze this failure.

Please review the workflow logs and the AI analysis for next steps.`,
              labels: ['build-failure', 'ai-monitored']
            });
