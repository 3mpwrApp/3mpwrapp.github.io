name: What's New Auto-Generator

on:
  schedule:
    # Daily at 06:10 UTC
    - cron: '10 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/CHANGELOG.md'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false # Don't cancel in progress updates

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-whatsnew:
    name: Generate What's New Module
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a # v4.2.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Generate What's New module
        run: npm run whatsnew:gen

      - name: Create Pull Request if changes detected
        uses: peter-evans/create-pull-request@5e914681df9dc83aa4e4905692ca88beb2f9e91f # v7.0.5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(whatsnew): auto-generate from docs/CHANGELOG.md'
          title: 'chore(whatsnew): daily auto-generation'
          body: |
            ## Auto-generated What's New Update
            
            This PR is automatically generated by the What's New Daily Generator workflow.
            
            ### Changes
            - Updates `data/whatsnew.auto.ts` from `docs/CHANGELOG.md`
            - Runs entirely on GitHub Actions (free tier)
            - No paid services required
            
            ### Testing
            - [ ] Review generated content in `data/whatsnew.auto.ts`
            - [ ] Verify app displays correctly in What's New tab
            - [ ] Check for any parsing errors or formatting issues
            
            ### Local Override
            ```bash
            npm run whatsnew:gen
            ```
            
            **Auto-generated on:** ${{ github.event_name == 'schedule' && 'scheduled run' || 'CHANGELOG.md change' }}
          branch: chore/whatsnew-auto-${{ github.run_number }}
          delete-branch: true
          labels: |
            automation
            whatsnew
            documentation
          draft: false
          add-paths: |
            data/whatsnew.auto.ts
