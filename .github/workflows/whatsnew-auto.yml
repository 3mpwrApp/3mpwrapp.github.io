name: What's New Auto-Generator

on:
  schedule:
    # Daily at 06:10 UTC
    - cron: '10 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/CHANGELOG.md'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false # Don't cancel in progress updates

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-whatsnew:
    name: Generate What's New Module
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node20v2-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Generate What's New module
        run: npm run whatsnew:gen

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet data/whatsnew.auto.ts; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected in whatsnew.auto.ts"
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in whatsnew.auto.ts"
          fi

      - name: Create Pull Request if changes detected
        if: steps.check_changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(whatsnew): auto-generate from docs/CHANGELOG.md'
          title: 'chore(whatsnew): daily auto-generation'
          body: |
            ## Auto-generated What's New Update
            
            This PR is automatically generated by the What's New Daily Generator workflow.
            
            ### Changes
            - Updates `data/whatsnew.auto.ts` from `docs/CHANGELOG.md`
            - Runs entirely on GitHub Actions (free tier)
            - No paid services required
            
            ### Testing
            - [ ] Review generated content in `data/whatsnew.auto.ts`
            - [ ] Verify app displays correctly in What's New tab
            - [ ] Check for any parsing errors or formatting issues
            
            ### Local Override
            ```bash
            npm run whatsnew:gen
            ```
            
            **Auto-generated on:** ${{ github.event_name == 'schedule' && 'scheduled run' || 'CHANGELOG.md change' }}
          branch: chore/whatsnew-auto-${{ github.run_number }}
          delete-branch: true
          labels: |
            automation
            whatsnew
            documentation
          draft: false
          add-paths: |
            data/whatsnew.auto.ts
