name: Stale Issues & PRs

on:
  schedule:
    # Run daily at 1:00 AM UTC
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark Stale Issues & PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mark stale issues and PRs
        uses: actions/stale@5f858e3efba33a5ca4407a664cc011ad407f2008 # v10.1.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          
          # Issues
          stale-issue-message: |
            This issue has been automatically marked as stale because it has not had recent activity. 
            It will be closed in 7 days if no further activity occurs.
            
            If you believe this issue is still relevant, please:
            - Comment on this issue to keep it open
            - Provide additional context or updates
            - Reference any related PRs or issues
            
            Thank you for your contributions!
          close-issue-message: |
            This issue has been automatically closed due to inactivity.
            If you believe this should be reopened, please create a new issue with updated context and reference this one.
          days-before-issue-stale: 60
          days-before-issue-close: 7
          stale-issue-label: 'stale'
          exempt-issue-labels: 'pinned,security,critical,roadmap'
          
          # Pull Requests
          stale-pr-message: |
            This pull request has been automatically marked as stale because it has not had recent activity.
            It will be closed in 14 days if no further activity occurs.
            
            If you plan to continue working on this PR:
            - Comment on this PR to keep it open
            - Rebase on the latest main branch
            - Address any review comments
            - Request a review when ready
            
            Thank you for your contributions!
          close-pr-message: |
            This pull request has been automatically closed due to inactivity.
            If you'd like to continue this work, please:
            1. Reopen this PR and rebase on main
            2. Or create a new PR referencing this one
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-label: 'stale'
          exempt-pr-labels: 'pinned,in-progress,blocked,security'
          
          # Operations
          operations-per-run: 100
          remove-stale-when-updated: true
          ascending: false # Check newest first
