  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v6 # v6.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v5 # v5.0.1
        with:
          path: node_modules
          key: ${{ runner.os }}-node20v2-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Run npm audit
        run: |
          npm audit --audit-level=moderate --production || true
          npm audit --audit-level=high --production

      - name: Check for high severity vulnerabilities
        run: |
          AUDIT_RESULT=$(npm audit --json --audit-level=high --production)
          echo "$AUDIT_RESULT"
          HIGH_COUNT=$(echo "$AUDIT_RESULT" | jq -r '.metadata.vulnerabilities.high // 0')
          CRITICAL_COUNT=$(echo "$AUDIT_RESULT" | jq -r '.metadata.vulnerabilities.critical // 0')
          
          if [ "$HIGH_COUNT" -gt 0 ] || [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "::error::Found $CRITICAL_COUNT critical and $HIGH_COUNT high severity vulnerabilities"
            exit 1
          fi
          echo "No high or critical vulnerabilities found"

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v6 # v6.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v5 # v5.0.1
        with:
          path: node_modules
          key: ${{ runner.os }}-node20v2-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Install license-checker
        run: npm install -g license-checker

      - name: Check licenses
        run: |
          license-checker --summary --production --excludePrivatePackages

      - name: Fail on GPL/AGPL licenses
        run: |
          FORBIDDEN=$(license-checker --production --json --excludePrivatePackages | jq -r 'to_entries[] | select(.value.licenses | test("GPL|AGPL"; "i")) | .key')
          if [ -n "$FORBIDDEN" ]; then
            echo "::error::Found forbidden GPL/AGPL licenses: $FORBIDDEN"
            exit 1
          fi
          echo "No forbidden licenses found"
        continue-on-error: true # Advisory for now

  security-validation:
    name: Security Configuration Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v6 # v6.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v5 # v5.0.1
        with:
          path: node_modules
          key: ${{ runner.os }}-node20v2-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Validate security configuration
        run: npm run security:validate

      - name: Run security tests
        run: npm run security:test
