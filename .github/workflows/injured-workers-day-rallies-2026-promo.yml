name: Injured Workers Day Rallies 2026 Promotion

# Injured Workers Day 2026 Rallies - Stop the Cuts to Workers Comp
# Posts 3x per week (Monday, Wednesday, Friday) through June 1
# Manual trigger available

on:
  workflow_dispatch:
  schedule:
    # Run 3x per week: Monday, Wednesday, Friday at 2 PM EST
    - cron: '0 19 * * 1'  # Monday 2 PM EST (7 PM UTC)
    - cron: '0 19 * * 3'  # Wednesday 2 PM EST (7 PM UTC)
    - cron: '0 19 * * 5'  # Friday 2 PM EST (7 PM UTC)

concurrency:
  group: injured-workers-day-rallies-2026-promo
  cancel-in-progress: false

jobs:
  post-injured-workers-day-rallies:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      
      - name: Install dependencies
        run: npm install
      
      - name: Check if campaign has ended
        id: check_date
        run: |
          if [ $(date +%s) -gt $(date -d '2026-06-01 23:59:59' +%s) ]; then
            echo "campaign_ended=true" >> $GITHUB_OUTPUT
            echo "✅ Campaign has ended, workflow will stop"
          else
            echo "campaign_ended=false" >> $GITHUB_OUTPUT
            echo "✊ Campaign active, proceeding with post"
          fi
      
      - name: Post to social media
        if: steps.check_date.outputs.campaign_ended == 'false'
        env:
          MASTO_TOKEN: ${{ secrets.MASTO_TOKEN }}
          MASTO_INSTANCE: ${{ secrets.MASTO_INSTANCE }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          node scripts/post-injured-workers-day-rallies-2026.js
      
      - name: Commit state file
        if: steps.check_date.outputs.campaign_ended == 'false'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/state/injured-workers-day-rallies-2026-state.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update Injured Workers Day Rallies 2026 state [skip ci]"
            git push
          fi
