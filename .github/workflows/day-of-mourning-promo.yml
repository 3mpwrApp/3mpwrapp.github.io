name: Day of Mourning Promotion

# Post Day of Mourning ceremony promotions 3x per week
# Monday, Wednesday, Friday at 1 PM UTC (8 AM EST)
# Runs until April 28, 2026

on:
  schedule:
    - cron: '0 13 * * 1'  # Monday 1 PM UTC (8 AM EST)
    - cron: '0 13 * * 3'  # Wednesday 1 PM UTC (8 AM EST)
    - cron: '0 13 * * 5'  # Friday 1 PM UTC (8 AM EST)
    
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode (skip posting, just show what would be posted)'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '20'

# Prevent overlapping runs
concurrency:
  group: day-of-mourning-promo
  cancel-in-progress: false

jobs:
  post_promotion:
    name: Post Day of Mourning Promotion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.CONTENT_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          npm ci --ignore-scripts --no-audit --fund=false
          echo "✅ Dependencies installed"

      - name: Post to social media
        env:
          MASTO_TOKEN: ${{ secrets.MASTO_TOKEN }}
          MASTO_INSTANCE: ${{ secrets.MASTO_INSTANCE }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_MODE: ${{ github.event.inputs.test_mode }}
        run: |
          echo "📤 Posting Day of Mourning promotion..."
          node scripts/post-day-of-mourning-promo.js
          
          if [ $? -eq 0 ]; then
            echo "✅ Successfully posted to social media"
          else
            echo "⚠️ Posting completed with warnings"
          fi

      - name: Commit state file
        id: commit
        continue-on-error: true
        run: |
          git config --local user.email "empowrapp08162025@gmail.com"
          git config --local user.name "3mpwrApp Content Bot"
          
          if [ -f ".github/state/day-of-mourning-state.json" ]; then
            git add .github/state/day-of-mourning-state.json
            
            if git diff --staged --quiet; then
              echo "No state changes to commit"
            else
              git commit -m "chore: update Day of Mourning promotion state [skip ci]"
              git push
              echo "✅ State file updated"
            fi
          fi

      - name: Summary
        run: |
          echo "## 🕯️ Day of Mourning Promotion" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Promotion posted successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Event Date:** April 28, 2026 at 6 PM EST" >> $GITHUB_STEP_SUMMARY
          echo "**Location:** First Wesley United Church, Thunder Bay" >> $GITHUB_STEP_SUMMARY
          echo "**Frequency:** 3x per week (Mon, Wed, Fri)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Posted to: Mastodon, Bluesky, Discord" >> $GITHUB_STEP_SUMMARY
