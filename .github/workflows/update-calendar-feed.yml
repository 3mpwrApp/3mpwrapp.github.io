name: Update Calendar Feed

on:
  schedule:
    # Run daily at 3 AM UTC (11 PM EST / 8 PM PST)
    - cron: '0 3 * * *'
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main
    paths:
      - 'scripts/generate-calendar-feed.mjs'
      - '.github/workflows/update-calendar-feed.yml'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Setup Node.js
        uses: actions/setup-node@v6 # v6.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v5 # v5.0.1
        with:
          path: node_modules
          key: ${{ runner.os }}-node20v2-${{ hashFiles('**/package-lock.json') }}
          
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
        
      - name: Setup Firebase service account
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > firebase/serviceAccount.json
          
      - name: Generate calendar feed
        run: node scripts/generate-calendar-feed.mjs
        
      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/events.ics
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update calendar feed [skip ci]" && git push)
          
      - name: Cleanup service account
        if: always()
        run: rm -f firebase/serviceAccount.json

