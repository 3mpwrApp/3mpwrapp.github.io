name: Daily Feature Article

# Generate and post daily feature spotlight articles
# Runs every day at 10 AM UTC (after main curator runs)

on:
  schedule:
    - cron: '0 10 * * *'  # 10:00 AM UTC daily
    
  workflow_dispatch:
    inputs:
      force_post:
        description: 'Force generate and post even if already done today'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '20'

# Prevent multiple daily feature runs from overlapping
concurrency:
  group: daily-feature
  cancel-in-progress: false

jobs:
  daily_feature:
    name: Generate Daily Feature Article
    runs-on: ubuntu-latest
    timeout-minutes: 25  # Reduced since deployment wait is now 10 minutes
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          npm ci --ignore-scripts --no-audit --fund=false
          echo "✅ Dependencies installed"

      - name: Generate daily feature article
        run: |
          echo "📝 Generating daily feature article..."
          node scripts/daily-feature-generator.js

      - name: Commit article
        run: |
          git config --local user.email "empowrapp08162025@gmail.com"
          git config --local user.name "3mpwrApp Content Bot"
          
          git add _posts/ public/ || true
          
          if git diff --staged --quiet; then
            echo "✅ No changes to commit"
            exit 0
          fi
          
          TODAY=$(date -u +%Y-%m-%d)
          git commit -m "feat(blog): Daily feature article - $TODAY"
          git push origin main

      - name: Wait for deployment
        run: |
          echo "⏳ Waiting for Cloudflare Pages to build and deploy..."
          echo "Starting wait at $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          
          # Get the article URL from the generated JSON
          if [ -f "public/daily-feature-social.json" ]; then
            ARTICLE_URL=$(jq -r '.url' public/daily-feature-social.json)
            echo "Target article URL: $ARTICLE_URL"
          else
            echo "❌ ERROR: No social JSON found, cannot verify deployment"
            exit 1
          fi
          
          # Wait for article to be accessible (up to 60 minutes)
          MAX_WAIT_MINUTES=60
          MAX_RETRIES=60  # Check every minute for 60 minutes
          RETRY_COUNT=0
          SUCCESS=false
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$SUCCESS" = "false" ]; do
            # Try to fetch the actual article page
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$ARTICLE_URL")
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Article is live and accessible! (HTTP $HTTP_CODE)"
              echo "Verified at $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
              SUCCESS=true
            else
              RETRY_COUNT=$((RETRY_COUNT + 1))
              ELAPSED_MINUTES=$((RETRY_COUNT))
              echo "⏳ Article not ready yet (HTTP $HTTP_CODE) - waiting... ($ELAPSED_MINUTES/$MAX_WAIT_MINUTES minutes)"
              
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                sleep 60  # Wait 1 minute between checks
              fi
            fi
          done
          
          if [ "$SUCCESS" = "false" ]; then
            echo "❌ ERROR: Article not accessible after $MAX_WAIT_MINUTES minutes!"
            echo "Last HTTP code: $HTTP_CODE"
            echo "Aborting social media posting to prevent 404 links."
            exit 1
          fi

      - name: Post to social media
        continue-on-error: true
        env:
          MASTO_INSTANCE: ${{ secrets.MASTO_INSTANCE }}
          MASTO_TOKEN: ${{ secrets.MASTO_TOKEN }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          BLUESKY_PDS: 'https://bsky.social'
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "📱 Posting to social media..."
          node scripts/post-daily-feature.js

      - name: Create summary
        if: always()
        run: |
          echo "# 📝 Daily Feature Article" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "public/daily-feature-social.json" ]; then
            FEATURE=$(jq -r '.feature' public/daily-feature-social.json)
            URL=$(jq -r '.url' public/daily-feature-social.json)
            echo "**Feature:** $FEATURE" >> $GITHUB_STEP_SUMMARY
            echo "**Article:** $URL" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f "public/feature-posting-results.json" ]; then
            echo "**Social Media:**" >> $GITHUB_STEP_SUMMARY
            MASTO_SUCCESS=$(jq -r '.results.mastodon.success' public/feature-posting-results.json)
            BLUE_SUCCESS=$(jq -r '.results.bluesky.success' public/feature-posting-results.json)
            echo "- Mastodon: $([ "$MASTO_SUCCESS" = "true" ] && echo "✅" || echo "❌")" >> $GITHUB_STEP_SUMMARY
            echo "- Bluesky: $([ "$BLUE_SUCCESS" = "true" ] && echo "✅" || echo "❌")" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-feature-${{ github.run_id }}
          path: |
            _posts/*feature-spotlight*.md
            public/daily-feature-social.json
            public/feature-posting-results.json
          retention-days: 7
