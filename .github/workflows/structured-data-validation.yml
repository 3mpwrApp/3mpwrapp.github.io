name: Structured Data Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 8 * * 1'  # Weekly Monday 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write  # For creating issue reports

concurrency:
  group: structured-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Install dependencies
        run: |
          npm ci
          bundle install

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Validate structured data
        id: validate
        run: |
          node scripts/validate-structured-data.js
        continue-on-error: true

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structured-data-report
          path: |
            reports/structured-data-validation.json

      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('reports/structured-data-validation.json', 'utf8'));
            
            let body = '## 📊 Structured Data Validation Report\n\n';
            body += `**Total schemas:** ${report.totalSchemas}\n`;
            body += `**Files with schemas:** ${report.filesWithSchemas}/${report.totalFiles}\n\n`;
            
            if (report.errors.length > 0) {
              body += `### ❌ Errors (${report.errors.length})\n\n`;
              report.errors.slice(0, 5).forEach(err => {
                body += `- **${err.type}**: ${err.message}\n`;
              });
              if (report.errors.length > 5) {
                body += `\n... and ${report.errors.length - 5} more\n`;
              }
            }
            
            if (report.warnings.length > 0) {
              body += `\n### ⚠️ Warnings (${report.warnings.length})\n\n`;
              const warningsByType = {};
              report.warnings.forEach(w => {
                warningsByType[w.type] = (warningsByType[w.type] || 0) + 1;
              });
              Object.entries(warningsByType).forEach(([type, count]) => {
                body += `- ${type}: ${count}\n`;
              });
            }
            
            if (report.errors.length === 0) {
              body += '\n✅ **All structured data validation passed!**\n';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Fail if critical errors
        if: steps.validate.outcome == 'failure'
        run: |
          echo "❌ Structured data validation failed"
          exit 1
