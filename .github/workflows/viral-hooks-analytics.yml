# VIRAL HOOKS ANALYTICS - Monthly Optimization
# Runs every 30 days to analyze hook performance and auto-optimize
# Also runs on 1st of each month to align with monthly themes

name: Viral Hooks Analytics

on:
  # Run on 1st of each month at 3 AM UTC
  schedule:
    - cron: '0 3 1 * *'
  
  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      force_rotation:
        description: 'Force rotation even if 30 days not passed'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  analyze-and-rotate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      - name: Install dependencies
        run: npm ci || npm install
        
      - name: Run hook analytics
        id: analytics
        run: |
          echo "🔮 Running Viral Hooks Analytics..."
          node scripts/viral-hooks-analytics.js
          
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet public/viral-hooks-analytics.json; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
          
      - name: Commit analytics updates
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/viral-hooks-analytics.json
          git commit -m "📊 chore(analytics): Monthly viral hooks rotation [$(date +%Y-%m)]"
          git push
          
      - name: Generate summary
        run: |
          echo "## 🔮 Viral Hooks Analytics Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f public/viral-hooks-analytics.json ]; then
            echo "### 📊 Current Status" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Extract key metrics using jq
            TOTAL=$(jq '.hooks | length' public/viral-hooks-analytics.json 2>/dev/null || echo "0")
            ROTATIONS=$(jq '.rotationCount' public/viral-hooks-analytics.json 2>/dev/null || echo "0")
            LAST=$(jq -r '.lastRotation' public/viral-hooks-analytics.json 2>/dev/null || echo "N/A")
            
            echo "- **Total hooks tracked:** $TOTAL" >> $GITHUB_STEP_SUMMARY
            echo "- **Rotations completed:** $ROTATIONS" >> $GITHUB_STEP_SUMMARY
            echo "- **Last rotation:** $LAST" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Top performers
            echo "### ⭐ Top Performing Hooks" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            jq -r '.performance.topHooks[:3] | .[] | "- \(.text | .[0:60])..." ' public/viral-hooks-analytics.json 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "- No data yet" >> $GITHUB_STEP_SUMMARY
            
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "---" >> $GITHUB_STEP_SUMMARY
            echo "✅ Analytics run complete" >> $GITHUB_STEP_SUMMARY
          else
            echo "📝 First run - no analytics data yet" >> $GITHUB_STEP_SUMMARY
          fi
