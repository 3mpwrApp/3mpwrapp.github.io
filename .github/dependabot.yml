# Dependabot configuration for automatic security updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # NPM dependencies - security and version updates
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    # Group minor and patch updates to reduce PR noise
    groups:
      expo-updates:
        patterns:
          - "expo*"
          - "@expo/*"
        update-types:
          - "minor"
          - "patch"
      react-updates:
        patterns:
          - "react"
          - "react-native"
          - "react-native-*"
          - "@react-*"
        update-types:
          - "minor"
          - "patch"
      firebase-updates:
        patterns:
          - "firebase"
          - "@firebase/*"
          - "firebase-*"
        update-types:
          - "minor"
          - "patch"
      testing-updates:
        patterns:
          - "jest"
          - "@testing-library/*"
          - "jest-*"
        update-types:
          - "minor"
          - "patch"
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    labels:
      - "dependencies"
      - "security"
    reviewers:
      - "empowrapp-team"
    ignore:
      # Ignore major version updates for core dependencies (review manually)
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]

  # GitHub Actions - keep workflows secure and up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
      - "security"
    reviewers:
      - "empowrapp-team"

  # Cloudflare Workers dependencies
  - package-ecosystem: "npm"
    directory: "/cloudflare-workers/events-feed"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(workers-deps)"
    labels:
      - "dependencies"
      - "cloudflare-workers"

  # Server dependencies (if separate package.json exists)
  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(server-deps)"
    labels:
      - "dependencies"
      - "server"
