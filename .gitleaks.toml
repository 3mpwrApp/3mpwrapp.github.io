# Gitleaks configuration file
# Excludes non-sensitive files from secret scanning

title = "3mpwr App Gitleaks Config"

# Global allowlist: these paths will be completely excluded from all scans
[allowlist]
paths = [
  # Documentation with example keys
  '''docs/.*\.md$''',
  '''CHANGELOG\.md$''',
  
  # Development and test files with non-sensitive keys
  '''scripts/.*\.(mjs|ts|js|ps1)$''',
  '''server/\.dev\.vars$''',
  '''server/\.firebase-key\.json$''',
  
  # Public Firebase configuration (client-side, intentionally public)
  '''google-services\.json$''',
  '''firebase/config\.ts$''',
  
  # Workflow files with example patterns
  '''.github/workflows/.*\.yml$''',
  
  # Build artifacts and dependencies
  '''node_modules/''',
  '''.expo/''',
  '''dist/''',
  '''build/''',
  '''.git/''',
  
  # Application code with i18n keys and cache keys (not secrets)
  '''app/.*\.(tsx?|jsx?)$''',
  '''components/.*\.(tsx?|jsx?)$''',
  '''store/.*\.(tsx?|jsx?)$''',
  '''utils/.*\.(tsx?|jsx?)$''',
  '''services/.*\.(tsx?|jsx?)$''',
  '''hooks/.*\.(tsx?|jsx?)$''',
  '''context/.*\.(tsx?|jsx?)$'''
]
