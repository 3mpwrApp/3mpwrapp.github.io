<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to 3mpwr App...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        h1 {
            margin: 0 0 20px 0;
            font-size: 24px;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .message {
            font-size: 16px;
            line-height: 1.6;
            margin-top: 20px;
        }
        .error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }
        a {
            color: #93c5fd;
            text-decoration: underline;
        }
        button {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.2s;
        }
        button:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>3mpwr App</h1>
        <div class="spinner"></div>
        <div class="message" id="message">Redirecting to the app...</div>
    </div>

    <script>
        (function() {
            const messageEl = document.getElementById('message');

            try {
                // Get the full URL query string
                const queryString = window.location.search;

                // Check if we have any parameters
                if (!queryString || queryString.length <= 1) {
                    messageEl.innerHTML = '<div class="error"><strong>Error:</strong> No authentication data received. Please try connecting again from the app.</div>';
                    return;
                }

                // Log for debugging (will show in browser console)
                console.log('OAuth callback received with params:', queryString);

                // Try custom URL scheme first (works with new builds that have intent filters)
                const deepLink = 'empowrapp://gdrive-callback' + queryString;
                console.log('Attempting deep link:', deepLink);
                window.location.href = deepLink;

                // If the custom scheme doesn't work, the page will still be visible
                // Show message and manual retry option
                setTimeout(function() {
                    // Create a clickable link that will work in older builds
                    // by using an <a> tag that Android can intercept
                    const manualLink = document.createElement('a');
                    manualLink.href = deepLink;
                    manualLink.textContent = 'Tap here to open 3mpwr';
                    manualLink.style.cssText = 'color: #93c5fd; font-weight: bold; text-decoration: underline; font-size: 18px;';
                    
                    messageEl.innerHTML = '<strong>Almost there!</strong><br><br>';
                    messageEl.appendChild(manualLink);
                    messageEl.innerHTML += '<br><br><small>If nothing happens, make sure the 3mpwr app is installed and try connecting again.</small>';
                }, 2000);

            } catch (error) {
                console.error('Redirect error:', error);
                messageEl.innerHTML =
                    '<div class="error">' +
                    '<strong>Error:</strong> ' + error.message + '<br><br>' +
                    'Please try connecting again from the app.' +
                    '</div>';
            }
        })();
    </script>
</body>
</html>
