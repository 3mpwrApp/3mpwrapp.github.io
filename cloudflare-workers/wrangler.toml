name = "empowrapp-pages"
type = "javascript"
main = "dist/index.js"
compatibility_date = "2024-12-20"

# Cloudflare Pages Functions configuration
# This file is used by Cloudflare to deploy functions/ directory

[build]
command = "npm run build"
cwd = "./"

# Environment variables for Cloudflare Pages Functions
[env.production]
vars = { EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID = "733708119893-so14q85mmnrtt5ulnan3qjs2o7ll73vs.apps.googleusercontent.com" }

[env.preview]
vars = { EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID = "733708119893-so14q85mmnrtt5ulnan3qjs2o7ll73vs.apps.googleusercontent.com" }

[env.development]
vars = { EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID = "733708119893-so14q85mmnrtt5ulnan3qjs2o7ll73vs.apps.googleusercontent.com" }
