name = "empowrapp-campaigns"
main = "src/index.js"
compatibility_date = "2024-01-01"

# KV Namespace for storing campaigns
[[kv_namespaces]]
binding = "CAMPAIGNS_KV"
id = "735bf388954b4dbeb6f8b5d357b1e5ed"

# Workers.dev subdomain
workers_dev = true

# Custom domain (optional - configure after deployment)
# routes = [
#   { pattern = "empowrapp-campaigns.yourdomain.com/*", zone_name = "yourdomain.com" }
# ]

# Environment variables (optional)
[vars]
ENVIRONMENT = "production"
