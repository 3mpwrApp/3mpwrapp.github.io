title: 3mpwrApp™
description: Practical tools and community for injured workers and persons with disabilities.
baseurl: ""
url: "https://3mpwrapp.ca"  # Primary custom domain

# Theme and markdown
markdown: kramdown
theme: minima

# Header pages (navigation in specific order)
header_pages:
  - about.md
  - demo/index.md
  - research.md
  - faq.md
  - accessibility.md
  - support.md
  - security.md
  - privacy.md
  - contact.md

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Permalinks and timezone
permalink: pretty
timezone: UTC
future: true

# Kramdown options (for Table of Contents)
kramdown:
  toc_levels: 2..4

# SEO and social (jekyll-seo-tag)
author:
  name: "3mpwr App"
logo: /assets/favicon.svg

defaults:
  - scope:
      path: ""
    values:
      image: /assets/empwrapp-logo.png
      lang: en
      seo:
        type: WebSite
        twitter:
          card: summary_large_image
          creator: "@3mpowrApp0816"

# Collections
collections:
  whats_new:
    output: true
    permalink: /whats-new/:name/
  knowledge_base:
    output: true
    permalink: /knowledge-base/:name/
  templates:
    output: true
    permalink: /templates/:name/

# Feeds: generate a dedicated feed for What's New collection
feed:
  collections:
    - whats_new

social:
  name: "3mpwrApp™"
  links:
    - https://github.com/3mpwrApp
    - https://www.facebook.com/3mpowrapp/
    - https://x.com/3mpowrapp0816
    - https://www.instagram.com/3mpwrapp/
    - https://www.youtube.com/3mpwrApp
    - https://www.tiktok.com/@3mpwrapp

ga_measurement_id: ""

# Privacy-friendly analytics (optional, free)
# Set one provider and its config values to enable consent-gated loading.
# Supported providers:
# - goatcounter: set analytics_provider: goatcounter and goatcounter_domain: your-id (from your-id.goatcounter.com)
# - ga (Google Analytics 4): leave analytics_provider empty and set ga_measurement_id
analytics_provider: ""   # "goatcounter" or ""
goatcounter_domain: ""   # e.g., "example" for https://example.goatcounter.com

twitter_username: "3mpowrApp0816"
github_username: "3mpwrApp"

# Asset variables used by custom-head.html
favicon: /assets/favicon.svg
webmanifest: /assets/site.webmanifest
# apple_touch_icon intentionally omitted

# Include Google Search Console verification file and well-known folder for Android App Links
include:
  - .well-known
  - google7c1f45d906f05cad.html
  - _headers
  - _redirects
  - _routes.json
  - google92c2c14246b0aaae.html
  - _headers
  - .well-known
  - public/whatsnew-2025.json
  - public/whatsnew-2026.json
  - public/whatsnew-unified.json

# Do not publish repository maintenance docs on the website
exclude:
  - README.md
  - CONTRIBUTING.md
  - ACTIVATION.md
  - ACTIVATION_COMPLETE.md
  - ACTIVATION_SUMMARY.md
  - HOW_TO_ACTIVATE.md
  - BETA_TESTERS_March31_ProductionCommitment_EMAIL.md
  - CANADA_WIDE_DATABASE_STATUS.md
  - CANLII-API-STRATEGY.md
  - CANLII-COLLECTION-GUIDE.md
  - CANLII-DATABASES.md
  - CANLII-DISCOVERY-SUMMARY.md
  - COMMUNITY_ENGAGEMENT_STRATEGY.md
  - CONTENT_OPTIMIZATION_TEMPLATES.md
  - DOMAIN-MIGRATION-COMPLETE.md
  - ENGAGEMENT_TRACKING_WORKFLOW.md
  - GOVERNANCE.md
  - HEARTBEAT.md
  - MEMORY.md
  - NEXT-STEPS-OCT-19-24.md
  - ONSBT-2020-2026-ANALYSIS-SUMMARY.md
  - ONSBT-COMPLETENESS-ANALYSIS.md
  - ONSBT-SUMMARY.md
  - QUICK-REFERENCE.md
  - QUICK-START-LAUNCH.md
  - QUICK_START_CHECKLIST.md
  - README-AGENTS.md
  - REMINDERS.md
  - SITE-HEALTH-CHECK.md
  - SOCIAL-SHARE-IMAGES-SPECS.md
  - SOCIAL-SHARING-IMPLEMENTATION.md
  - SOCIAL_AUTOMATION_COMPLETE.md
  - SOUL.md
  - SUBMISSIONS-API-SETUP.md
  - TOOLS.md
  - USER.md
  - YOUR-WEBSITE-URLS.md
  - app-tour.md
  - app-waitlist.md
  - chronic-pain-appeal.md
  - chronic-pain-claims.md
  - how-to-use-this-data.md
  - research-backup-20260430210529.md
  - roadmap.md
  - "2025-*.md"
  - "2026-*.md"
  - .github
  - Gemfile
  - Gemfile.lock
  - node_modules
  - public
  - vendor
