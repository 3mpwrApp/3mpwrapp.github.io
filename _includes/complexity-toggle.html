<!-- Complexity Mode Toggle Button & Announcer -->
<button id="complexity-toggle" type="button" aria-live="polite">
  <span class="complexity-icon" aria-hidden="true">📖</span>
  <span class="complexity-label">Standard View</span>
  <span class="complexity-hint">Click for Simple Language</span>
</button>

<div id="complexity-announcer" role="status" aria-live="polite" aria-atomic="true"></div>
