<!DOCTYPE html>
<html>
<head>
    <title>Google Drive Authorization</title>
    <style>
        body {
            font-family: system-ui;
            padding: 20px;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            max-width: 500px;
        }
        .processing {
            background: #e3f2fd;
            border: 1px solid #90caf9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .success {
            background: #e8f5e9;
            border: 1px solid #81c784;
            padding: 20px;
            border-radius: 8px;
        }
        .error {
            background: #fee;
            border: 1px solid #f88;
            padding: 20px;
            border-radius: 8px;
        }
        h1 {
            margin: 0 0 10px 0;
        }
        p {
            margin: 10px 0;
            color: #666;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="processing" id="processing">
            <h1>🔐 Processing Authorization</h1>
            <div class="spinner"></div>
            <p>Connecting to your Google Drive...</p>
            <p style="font-size: 12px; color: #999;">Please do not close this window.</p>
        </div>
        
        <div class="success" id="success" style="display: none;">
            <h1>✓ Authorization Successful</h1>
            <p>Your Google Drive connection is being established.</p>
            <p>This window will close automatically.</p>
        </div>
        
        <div class="error" id="error" style="display: none;">
            <h1>✗ Authorization Failed</h1>
            <p id="error-message"></p>
            <p style="font-size: 12px; color: #999;">You can close this window.</p>
        </div>
    </div>
    
    <script>
        (function() {
            console.log('[GDrive Callback] Page loaded, URL:', window.location.href);
            console.log('[GDrive Callback] Has opener:', !!window.opener);
            
            const url = new URL(window.location.href);
            
            // Check for code in query params (code flow)
            const code = url.searchParams.get('code');
            const error = url.searchParams.get('error');
            const state = url.searchParams.get('state');
            
            // Check for access_token in hash (implicit flow)
            const hashParams = new URLSearchParams(url.hash.substring(1));
            const accessToken = hashParams.get('access_token');
            
            console.log('[GDrive Callback] Parsed:', { code: !!code, accessToken: !!accessToken, error });
            
            // Show appropriate message
            if (error) {
                const errorDesc = url.searchParams.get('error_description') || 'Unknown error';
                document.getElementById('processing').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error-message').textContent = `${error}: ${errorDesc}`;
            } else if (accessToken) {
                // Implicit flow - token in hash
                console.log('[GDrive Callback] Processing access token (implicit flow)');
                document.getElementById('processing').style.display = 'none';
                document.getElementById('success').style.display = 'block';
                
                // Try to post message to opener
                if (window.opener) {
                    // Build the callback URL with the token in hash
                    const callbackUrl = new URL(window.location.origin + '/gdrive-callback');
                    callbackUrl.hash = url.hash; // Preserve the entire hash with token
                    
                    const message = {
                        type: 'expo-auth-session',
                        url: callbackUrl.toString()
                    };
                    
                    console.log('[GDrive Callback] Posting message to opener:', message);
                    window.opener.postMessage(message, '*');
                    console.log('[GDrive Callback] Message posted, will close in 1.5s');
                    
                    // Close after delay
                    setTimeout(() => {
                        console.log('[GDrive Callback] Closing window');
                        window.close();
                    }, 1500);
                } else {
                    console.error('[GDrive Callback] No window.opener - cannot send message');
                }
            } else if (code) {
                // Code flow - code in query params
                console.log('[GDrive Callback] Processing authorization code (code flow)');
                document.getElementById('processing').style.display = 'none';
                document.getElementById('success').style.display = 'block';
                
                // Try to post message to opener
                if (window.opener) {
                    // Build the callback URL with the code
                    const callbackUrl = new URL(window.location.origin + '/gdrive-callback');
                    callbackUrl.searchParams.set('code', code);
                    if (state) {
                        callbackUrl.searchParams.set('state', state);
                    }
                    
                    const message = {
                        type: 'expo-auth-session',
                        url: callbackUrl.toString()
                    };
                    
                    console.log('[GDrive Callback] Posting message to opener:', message);
                    window.opener.postMessage(message, '*');
                    console.log('[GDrive Callback] Message posted, will close in 1.5s');
                    
                    // Close after delay
                    setTimeout(() => {
                        console.log('[GDrive Callback] Closing window');
                        window.close();
                    }, 1500);
                } else {
                    console.error('[GDrive Callback] No window.opener - cannot send message');
                }
            } else {
                console.error('[GDrive Callback] No code or token found in URL');
                document.getElementById('processing').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error-message').textContent = 'No authorization code or token found. Please try again.';
            }
        })();
    </script>
</body>
</html>
