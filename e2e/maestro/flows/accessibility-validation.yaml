# Accessibility Validation Flow
# WCAG 2.2 AAA Compliance Testing via UI Automation
#
# Tests:
# - Interactive elements are accessible
# - Focus management works correctly
# - Screen reader compatibility
# - Touch targets are adequate
# - Content is visible and readable

appId: com.app3mpwr.app3mpwr

---

# Test: All Tab Buttons Have Accessibility Labels
- tapOn:
    text: "Home"
    retryTapIfNoChange: true
- assertVisible:
    id: "home-screen"
    optional: true

- tapOn:
    text: "Campaigns"
- assertVisible:
    text: "Campaigns"

- tapOn:
    text: "Community"
- assertVisible:
    text: "Community"

- tapOn:
    text: "Resources"
- assertVisible:
    text: "Resources"

- tapOn:
    text: "Wellness"
- assertVisible:
    text: "Wellness"

- tapOn:
    text: "Advocacy"
- assertVisible:
    text: "Advocacy"

- tapOn:
    text: "Settings"
- assertVisible:
    text: "Settings"

---

# Test: Interactive Elements Have Touch Targets
# Verify buttons are tappable (implies minimum touch target size)
- tapOn:
    text: "Home"
- waitForAnimationToEnd

# Try tapping various interactive elements
- tapOn:
    text: ".*"
    index: 0
    optional: true
- waitForAnimationToEnd
- back

---

# Test: Content Visible at Different Zoom Levels
# This tests that content doesn't disappear with larger text
- tapOn:
    text: "Settings"
- waitForAnimationToEnd

# Navigate to accessibility settings if available
- tapOn:
    text: "Accessibility"
    optional: true
- waitForAnimationToEnd

# Verify text is still visible after navigating
- assertVisible:
    text: ".*"
    enabled: true

---

# Test: Focus Management on Modal/Overlay
- tapOn:
    text: "Home"
- waitForAnimationToEnd

# Try to open a modal/dialog if one exists
- tapOn:
    id: "help-button"
    optional: true
- waitForAnimationToEnd

# If modal opened, verify it can be closed
- tapOn:
    text: "Close"
    optional: true
- tapOn:
    id: "close-button"
    optional: true

---

# Test: Form Field Accessibility
- tapOn:
    text: "Settings"
- waitForAnimationToEnd

- tapOn:
    text: "Profile"
    optional: true
- waitForAnimationToEnd

# Verify form fields are accessible
- tapOn:
    id: ".*input.*"
    optional: true
- inputText: "Test"
- hideKeyboard

---

# Test: Back Navigation Works (Escape Route)
- tapOn:
    text: "Wellness"
- waitForAnimationToEnd

# Navigate deeper
- tapOn:
    text: ".*"
    index: 0
    optional: true
- waitForAnimationToEnd

# Verify back navigation works
- back
- waitForAnimationToEnd
- back
- waitForAnimationToEnd

# Should be back on a main screen
- assertVisible:
    text: ".*"
    enabled: true

---

# Test: Error States Are Announced
# Navigate to a form and try to submit empty
- tapOn:
    text: "Settings"
- waitForAnimationToEnd

- tapOn:
    text: "Feedback"
    optional: true
- waitForAnimationToEnd

- tapOn:
    text: "Submit"
    optional: true
- waitForAnimationToEnd

# Verify error message is visible (not just color change)
- assertVisible:
    text: ".*required.*|.*error.*|.*invalid.*"
    optional: true

---

# Test: Loading States Are Accessible
- tapOn:
    text: "Community"
- waitForAnimationToEnd

# Loading indicator should be visible briefly or content should load
- waitFor:
    visible:
      text: ".*"
    timeout: 10000

---

# Test: Swipe Gestures Work
- tapOn:
    text: "Wellness"
- waitForAnimationToEnd

# Test swipe gestures on scrollable content
- swipe:
    direction: UP
- swipe:
    direction: DOWN
- swipe:
    direction: LEFT
    optional: true
- swipe:
    direction: RIGHT
    optional: true

---

# Final Validation: App Still Responsive
- tapOn:
    text: "Home"
- waitForAnimationToEnd
- assertVisible:
    text: ".*"
    enabled: true

- evalScript: |
    output.accessibilityTestsPassed = true
