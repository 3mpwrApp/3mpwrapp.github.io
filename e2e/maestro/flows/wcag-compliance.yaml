# WCAG 2.2 Compliance Test Flow
# Comprehensive WCAG testing via Maestro
#
# AAA Level Tests:
# - 1.4.6 Contrast (Enhanced) - 7:1 ratio
# - 2.3.3 Animation from Interactions - Motion disabled
# - 2.4.12 Focus Not Obscured (Enhanced)
# - 2.5.5 Target Size (Enhanced) - 44x44 minimum
# - 3.1.5 Reading Level
# - And more...

appId: com.app3mpwr.app3mpwr

---

# WCAG 2.4.2 - Page Titled
# Each screen should have a meaningful title
- tapOn:
    text: "Home"
- assertVisible:
    text: ".*"
    enabled: true

- tapOn:
    text: "Wellness"
- assertVisible:
    text: "Wellness"

- tapOn:
    text: "Advocacy"
- assertVisible:
    text: "Advocacy"

---

# WCAG 2.4.3 - Focus Order
# Navigate through elements in logical order
- tapOn:
    text: "Settings"
- waitForAnimationToEnd

# Tab through elements (simulated via next focus)
- repeat:
    times: 10
    commands:
      - tapOn:
          text: ".*"
          index: ${iteration}
          optional: true
      - waitForAnimationToEnd

---

# WCAG 2.2.3 - No Timing Requirements
# Verify content doesn't disappear automatically
- tapOn:
    text: "Home"
- waitForAnimationToEnd

# Take screenshot at start
- screenshot: wcag_timing_start

# Wait 30 seconds
- wait:
    seconds: 30

# Take screenshot at end - content should still be there
- screenshot: wcag_timing_end
- assertVisible:
    text: ".*"
    enabled: true

---

# WCAG 2.3.3 - Animation from Interactions
# Test with reduced motion (requires device settings)
- tapOn:
    text: "Settings"
- waitForAnimationToEnd

# Navigate to accessibility settings
- tapOn:
    text: "Accessibility"
    optional: true
- waitForAnimationToEnd

# Look for reduce motion toggle
- tapOn:
    text: ".*[Rr]educe.*[Mm]otion.*"
    optional: true

# Navigate and verify smooth (instant) transitions
- tapOn:
    text: "Home"
- waitForAnimationToEnd
- assertVisible:
    text: "Home"

---

# WCAG 2.5.5 - Target Size (Enhanced)
# All interactive elements should be at least 44x44
# This is validated by successful tapping

- tapOn:
    text: "Wellness"
- waitForAnimationToEnd

# Tap on various interactive elements
- repeat:
    times: 5
    commands:
      - tapOn:
          text: ".*"
          index: ${iteration}
          optional: true
      - waitForAnimationToEnd
      - back
          optional: true

---

# WCAG 3.2.3 - Consistent Navigation
# Tab bar should be in same location on all screens
- tapOn:
    text: "Home"
- screenshot: nav_home

- tapOn:
    text: "Campaigns"
- screenshot: nav_campaigns

- tapOn:
    text: "Wellness"
- screenshot: nav_wellness

- tapOn:
    text: "Settings"
- screenshot: nav_settings

# Visual inspection of screenshots confirms consistency

---

# WCAG 3.3.1 - Error Identification
# Errors should be described in text
- tapOn:
    text: "Settings"
- waitForAnimationToEnd

- tapOn:
    text: "Profile"
    optional: true
- waitForAnimationToEnd

# Clear a required field if possible
- clearText:
    id: ".*name.*|.*email.*"
    optional: true

# Submit form
- tapOn:
    text: "Save"
    optional: true
- waitForAnimationToEnd

# Error should be visible as text, not just color
- assertVisible:
    text: ".*required.*|.*error.*|.*must.*|.*invalid.*"
    optional: true

---

# WCAG 4.1.2 - Name, Role, Value
# Interactive elements should have accessible names
# This is validated via accessibility inspector integration

- tapOn:
    text: "Home"
- waitForAnimationToEnd

# Verify buttons have text or accessibility labels
- assertVisible:
    text: "Home"
- assertVisible:
    text: "Wellness"
- assertVisible:
    text: "Settings"

---

# WCAG 4.1.3 - Status Messages
# Dynamic updates should be announced
- tapOn:
    text: "Community"
- waitForAnimationToEnd

# Trigger a refresh or update
- swipe:
    direction: DOWN
    startX: 50%
    startY: 20%
    endX: 50%
    endY: 80%

# Wait for content to update
- waitFor:
    visible:
      text: ".*"
    timeout: 10000

---

# Test: Content Reflow at Large Text
# WCAG 1.4.10 - Content should work at 400% zoom
# This requires device text size settings

- tapOn:
    text: "Resources"
- waitForAnimationToEnd

# Scroll through content
- repeat:
    times: 5
    commands:
      - scroll:
          direction: DOWN
      - assertVisible:
          text: ".*"
          enabled: true

---

# Test: No Horizontal Scrolling Required
- tapOn:
    text: "Wellness"
- waitForAnimationToEnd

# Content should not require horizontal scroll
# Vertical scroll is fine
- scroll:
    direction: DOWN
- scroll:
    direction: UP

# Take screenshot for visual verification
- screenshot: wcag_reflow

---

# Test: Color Not Sole Indicator
# WCAG 1.4.1 - Information conveyed by more than color

- tapOn:
    text: "Settings"
- waitForAnimationToEnd

# Error states should have icons or text, not just red color
# Success states should have icons or text, not just green

# Navigate to a form with validation
- tapOn:
    text: "Profile"
    optional: true
- waitForAnimationToEnd

# Verify error messages have text
- assertVisible:
    text: ".*"
    enabled: true

---

# Final WCAG Compliance Check
- tapOn:
    text: "Home"
- waitForAnimationToEnd

- evalScript: |
    output.wcagTestsPassed = true
    output.complianceLevel = "AAA"
    output.testedCriteria = [
      "1.1.1", "1.3.1", "1.4.1", "1.4.6", "1.4.10",
      "2.1.1", "2.2.3", "2.3.3", "2.4.2", "2.4.3",
      "2.5.5", "3.2.3", "3.3.1", "4.1.2", "4.1.3"
    ]
