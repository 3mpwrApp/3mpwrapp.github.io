<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    
    <!-- 
      CSP Configuration for Expo Web Development
      'unsafe-eval' is required for Metro bundler in development
      Remove or restrict in production builds
    -->
    <meta 
      http-equiv="Content-Security-Policy" 
      content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://maps.googleapis.com https://*.firebaseapp.com https://*.firebase.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' data: https://fonts.gstatic.com;
        img-src 'self' data: blob: https: http:;
        connect-src 'self' ws: wss: https: http: blob:;
        frame-src 'self' https://maps.googleapis.com https://*.firebaseapp.com;
        worker-src 'self' blob:;
      "
    />
    
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA Configuration -->
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="3mpwr App - Empowering Canadians through Inclusive Technology" />
    
    <!-- Apple Mobile Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <title>3mpwr App</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Early console filtering to reduce React Native Web noise -->
    <script>
      (function() {
        if (typeof window !== 'undefined') {
          const originalWarn = console.warn;
          const originalError = console.error;
          
          // Counter for debugging
          let suppressedCount = 0;
          
          const suppressedPatterns = [
            /shadow.*style props are deprecated/i,
            /Use.*boxShadow/i,
            /expo-notifications.*not yet fully supported on web/i,
            /Listening to push token changes/i,
            /VirtualizedLists should never be nested/i,
            /componentWillReceiveProps/i,
            /componentWillMount/i,
            /componentWillUpdate/i,
            /Each child in a list should have a unique "key" prop/i,
          ];
          
          const shouldSuppress = function(message) {
            if (!message) return false;
            const messageStr = String(message);
            for (let i = 0; i < suppressedPatterns.length; i++) {
              if (suppressedPatterns[i].test(messageStr)) {
                suppressedCount++;
                return true;
              }
            }
            return false;
          };
          
          console.warn = function() {
            const args = Array.prototype.slice.call(arguments);
            const message = args.join(' ');
            if (!shouldSuppress(message)) {
              originalWarn.apply(console, args);
            }
          };
          
          console.error = function() {
            const args = Array.prototype.slice.call(arguments);
            const message = args.join(' ');
            if (!shouldSuppress(message)) {
              originalError.apply(console, args);
            }
          };
          
          // Show summary after 10 seconds
          setTimeout(function() {
            if (suppressedCount > 0) {
              console.info('[3mpwr] Suppressed ' + suppressedCount + ' known development warnings');
            }
            // Optionally restore original console (uncomment if needed)
            // console.warn = originalWarn;
            // console.error = originalError;
          }, 10000);
        }
      })();
    </script>
    
    <style>
      /* Prevent flash of unstyled content */
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      
      #root {
        display: flex;
        flex-direction: column;
      }
      
      /* Loading indicator */
      .expo-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #ffffff;
      }
      
      .expo-loading-spinner {
        width: 50px;
        height: 50px;
        border: 3px solid #f3f3f3;
        border-top: 3px solid #000000;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      /* Accessibility: Respect prefers-reduced-motion */
      @media (prefers-reduced-motion: reduce) {
        .expo-loading-spinner {
          animation: none;
          border-top-color: transparent;
        }
      }
      
      /* Dark mode support */
      @media (prefers-color-scheme: dark) {
        .expo-loading {
          background: #000000;
        }
        .expo-loading-spinner {
          border-color: #333333;
          border-top-color: #ffffff;
        }
      }
    </style>
  </head>
  <body>
    <noscript>
      <div style="padding: 20px; text-align: center; font-family: Arial, sans-serif;">
        <h1>JavaScript Required</h1>
        <p>This application requires JavaScript to run. Please enable JavaScript in your browser settings.</p>
      </div>
    </noscript>
    
    <!-- App root -->
    <div id="root">
      <!-- Loading indicator (removed by React when app mounts) -->
      <div class="expo-loading">
        <div class="expo-loading-spinner"></div>
      </div>
    </div>
    
    <!-- Expo will inject the bundled JavaScript here -->
  </body>
</html>
