<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3mpwr App</title>
    <style>
        html, body, #root {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #root {
            display: flex;
            flex-direction: column;
        }
        .expo-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #ffffff;
        }
        .expo-loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #22c55e;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="expo-loading">
            <div class="expo-loading-spinner"></div>
        </div>
    </div>
    
    <!-- Load expo-router bundle as ES module to support import.meta -->
    <script type="module">
        // Import the expo-router entry point
        import('./node_modules/expo-router/entry.bundle?platform=web&dev=true&hot=false&lazy=true&transform.routerRoot=app')
            .catch(err => {
                console.error('[Bootstrap] Failed to load app:', err);
                document.getElementById('root').innerHTML = `
                    <div style="padding: 20px; text-align: center;">
                        <h1 style="color: #c00;">App Loading Failed</h1>
                        <p>Metro bundler may not be running. Start it with: npx expo start</p>
                        <pre style="background: #f5f5f5; padding: 10px; text-align: left;">${err.message}</pre>
                    </div>
                `;
            });
    </script>
</body>
</html>
