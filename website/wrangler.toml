# Cloudflare Pages Configuration for 3mpwr App Website
# This configures bindings for the Pages Functions

name = "3mpwrapp-website"
compatibility_date = "2024-01-01"

# ============================================
# KV Namespace Bindings
# ============================================
# Create KV namespace with: wrangler kv:namespace create SUBMISSIONS_KV
# Then add the ID below

[[kv_namespaces]]
binding = "SUBMISSIONS_KV"
id = "YOUR_KV_NAMESPACE_ID_HERE"  # Replace after running setup script

# ============================================
# D1 Database Bindings (Optional)
# ============================================
# Create D1 database with: wrangler d1 create submissions-db
# Then add the ID below

# [[d1_databases]]
# binding = "SUBMISSIONS_DB"
# database_name = "submissions-db"
# database_id = "YOUR_D1_DATABASE_ID_HERE"  # Replace after running setup script

# ============================================
# Environment Variables
# ============================================
# Set these in Cloudflare Pages Dashboard → Settings → Environment Variables
# Or uncomment and set below for local development

[vars]
ENVIRONMENT = "production"

# NOTIFICATION_WEBHOOK_URL = "https://discord.com/api/webhooks/YOUR_WEBHOOK"
# ADMIN_EMAIL = "admin@3mpwrapp.com"
